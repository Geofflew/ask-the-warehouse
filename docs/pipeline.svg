<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="870" viewBox="0 0 1080 870" role="img" aria-labelledby="title desc"><title id="title">From a business question to an inspectable answer</title><desc id="desc">Question and documentation build a prompt for a scripted planner. SQL passes a policy check; rejected SQL stops. Structural risk routes to a scripted critic that can approve or revise once, with revised SQL checked again. Accepted SQL runs with a restricted database role in a read-only transaction. Answer formatting marks row-cap gaps and moves rows beyond the inline byte target to a local CSV. Trace is a separate diagnostic of rule exposure, not an automatic repair.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#718198"/></marker></defs><rect width="1080" height="870" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="43" font-size="26" fill="#14243a" font-weight="700">From a business question to an inspectable answer</text><text x="28" y="78" font-size="18" fill="#243247" font-weight="400">Control what reaches the planner, what may run, and what the answer claims.</text><rect x="28" y="112" width="622" height="132" rx="12" fill="#eef2f9" stroke="#ccd7e4"/><text x="48" y="143" font-size="23" fill="#14243a" font-weight="700">1  Make the relevant rule reach the planner</text><text x="48" y="177" font-size="18" fill="#243247" font-weight="400">Question + selected docs → prompt → scripted SQL planner</text><text x="48" y="209" font-size="17" fill="#243247" font-weight="400">Retrieval ranks and trims context. No SQL → unsupported.</text><rect x="750" y="112" width="302" height="132" rx="12" fill="#fff" stroke="#ccd7e4"/><text x="768" y="143" font-size="21" fill="#14243a" font-weight="700">Diagnostic: trace()</text><text x="768" y="177" font-size="16" fill="#243247" font-weight="400">Explains whether a rule reached</text><text x="768" y="202" font-size="16" fill="#243247" font-weight="400">the prompt, and why. It does</text><text x="768" y="227" font-size="16" fill="#243247" font-weight="400">not repair rule placement.</text><path d="M339 250V286" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="274" font-size="15" fill="#52647c" font-weight="400">proposed SQL</text><rect x="28" y="300" width="622" height="132" rx="12" fill="#eaf6f1" stroke="#a7d4c5"/><text x="48" y="333" font-size="23" fill="#12675b" font-weight="700">2  Check permission before execution</text><text x="48" y="368" font-size="17" fill="#243247" font-weight="400">Parse SQL; check documented tables, columns and functions.</text><text x="48" y="399" font-size="17" fill="#243247" font-weight="400">Rejected SQL stops. Accepted plans carry structural-risk flags.</text><path d="M656 365H738" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="662" y="349" font-size="15" fill="#52647c" font-weight="400">risk found</text><rect x="750" y="300" width="302" height="166" rx="12" fill="#fff5d9" stroke="#dfce94"/><text x="768" y="332" font-size="21" fill="#14243a" font-weight="700">Optional scripted critic</text><text x="768" y="366" font-size="17" fill="#243247" font-weight="400">Approve, or revise once.</text><text x="768" y="395" font-size="16" fill="#243247" font-weight="400">Certain notes trigger revision.</text><text x="768" y="424" font-size="16" fill="#243247" font-weight="400">Revised SQL is policy-checked;</text><text x="768" y="449" font-size="16" fill="#243247" font-weight="400">a failed recheck stops it.</text><path d="M339 438V508" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="479" font-size="15" fill="#52647c" font-weight="400">no structural risk</text><path d="M901 472V491H625V508" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="690" y="483" font-size="15" fill="#52647c" font-weight="400">approved / revised and rechecked</text><rect x="28" y="522" width="1024" height="114" rx="12" fill="#eaf6f1" stroke="#a7d4c5"/><text x="48" y="554" font-size="23" fill="#12675b" font-weight="700">3  Enforce a separate database boundary</text><text x="48" y="588" font-size="18" fill="#243247" font-weight="400">Restricted role + read-only transaction + statement timeout</text><text x="48" y="615" font-size="17" fill="#243247" font-weight="400">Database permission and timeout errors stop execution; passing policy is not enough.</text><path d="M339 642V678" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="668" font-size="15" fill="#52647c" font-weight="400">fetched rows</text><rect x="28" y="692" width="1024" height="124" rx="12" fill="#eef2f9" stroke="#ccd7e4"/><text x="48" y="724" font-size="23" fill="#14243a" font-weight="700">4  State what the result actually contains</text><text x="48" y="757" font-size="17" fill="#243247" font-weight="400">Row cap exceeded → mark partial. Inline answer too large → put retained rows in a local CSV.</text><text x="48" y="787" font-size="17" fill="#243247" font-weight="400">Include executed SQL, assumptions, gaps and load timestamps; log the answer metadata.</text><text x="28" y="847" font-size="17" fill="#52647c" font-weight="400">Synthetic data and scripted models test the pipeline’s behavior, not live-model accuracy.</text></g></svg>
