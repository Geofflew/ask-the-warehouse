<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="484" viewBox="0 0 1040 484" role="img" aria-labelledby="title desc"><title id="title">A rule in the docs can be absent from the prompt</title><desc id="desc">Question: “List the forecasting deals won in 2025.” Business rule: the forecasting product is stored as “Horizon”. Rule omitted: Rule is written in prose below a column table. Prompt builder omits that prose section. Planner matches names: 22 deals, only 7 correct. Rule included: Rule is attached to the phrase “forecasting deal”. The question matches; the rule enters the prompt. Planner filters by SKU: 41 deals, all 41 correct. Synthetic data and a scripted planner: rule presence selects prepared SQL.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#63758a"/></marker></defs><rect width="1040" height="484" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="44" font-size="25" fill="#14243a" font-weight="700">A rule in the docs can be absent from the prompt</text><text x="28" y="82" font-size="18" fill="#243247" font-weight="400">Question: “List the forecasting deals won in 2025.”</text><text x="28" y="110" font-size="18" fill="#243247" font-weight="400">Business rule: the forecasting product is stored as “Horizon”.</text><text x="28" y="163" font-size="12" fill="#a23d29" font-weight="700">RULE OMITTED</text><rect x="28" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="44" y="210" font-size="18" fill="#243247" font-weight="400">Rule is written in prose</text><text x="44" y="236" font-size="18" fill="#243247" font-weight="400">below a column table.</text><path d="M339 218H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="382" y="210" font-size="18" fill="#243247" font-weight="400">Prompt builder omits</text><text x="382" y="236" font-size="18" fill="#243247" font-weight="400">that prose section.</text><path d="M677 218H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="178" width="306" height="80" rx="9" fill="#fff1ed" stroke="#e8b9aa"/><text x="720" y="210" font-size="18" fill="#243247" font-weight="400">Planner matches names:</text><text x="720" y="236" font-size="18" fill="#243247" font-weight="400">22 deals, only 7 correct.</text><text x="28" y="305" font-size="12" fill="#12675b" font-weight="700">RULE INCLUDED</text><rect x="28" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="44" y="352" font-size="18" fill="#243247" font-weight="400">Rule is attached to the</text><text x="44" y="378" font-size="18" fill="#243247" font-weight="400">phrase “forecasting deal”.</text><path d="M339 360H359" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="366" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="382" y="352" font-size="18" fill="#243247" font-weight="400">The question matches;</text><text x="382" y="378" font-size="18" fill="#243247" font-weight="400">the rule enters the prompt.</text><path d="M677 360H697" stroke="#63758a" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="320" width="306" height="80" rx="9" fill="#eaf6f1" stroke="#a7d4c5"/><text x="720" y="352" font-size="18" fill="#243247" font-weight="400">Planner filters by SKU:</text><text x="720" y="378" font-size="18" fill="#243247" font-weight="400">41 deals, all 41 correct.</text><text x="28" y="458" font-size="16" fill="#52647c" font-weight="400">Scripted planner: rule presence selects prepared SQL. trace() explains omissions; it does not fix them.</text></g></svg>
